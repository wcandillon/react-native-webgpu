name: Setup
description: Setup Node.js and install dependencies

inputs:
  github_token:
    description: 'GitHub Token'
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      run: |
        HASH_FILE="/tmp/.yarn-lock-hash"
        CURRENT_HASH=$(shasum yarn.lock | cut -d' ' -f1)
        if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$CURRENT_HASH" ] && [ -d "node_modules" ]; then
          echo "yarn.lock unchanged and node_modules exists — skipping install"
        else
          yarn install --immutable
          echo "$CURRENT_HASH" > "$HASH_FILE"
        fi
      shell: bash

    # Cache only the pinned header ZIP. Apple SDK archives stay in the runner's
    # shared local cache; this avoids uploading them in every setup job.
    # Header copying verifies the cached ZIP, including when Yarn install is skipped.
    - name: Cache Dawn header archive
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/react-native-skia/*/*/dawn-headers.zip
          ~/.cache/react-native-skia/*/*/dawn-headers.zip
          ~/AppData/Local/react-native-skia/*/*/dawn-headers.zip
        key: ${{ runner.os }}-${{ runner.arch }}-dawn-headers-${{ hashFiles('packages/webgpu/binaries.json') }}

    # Populate cpp/dawn/include before checks, compilation, and npm publishing.
    # Checkout omits these source/generated headers; no native build runs here.
    - name: Copy Dawn headers
      working-directory: packages/webgpu
      shell: bash
      run: yarn copy-dawn-headers

    - name: Check Dawn
      working-directory: packages/webgpu
      shell: bash
      run: yarn check-dawn
