name: apple-sdks
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "packages/webgpu/apple/**"
      - "packages/webgpu/cpp/**"
      - "packages/webgpu/package.json"
      - "packages/webgpu/binaries.json"
      - "packages/webgpu/scripts/*apple*binaries.sh"
      - "packages/webgpu/scripts/apple-binary-utils.sh"
      - "packages/webgpu/scripts/check-apple-sdks.sh"
      - "packages/webgpu/scripts/prepare-dawn-headers.mjs"
      - ".github/workflows/apple-sdks.yml"
jobs:
  apple-sdks:
    # Syntax-check only: no yarn install, no pods, no simulator. Only the Dawn
    # headers archive is downloaded from the pinned Skia binaries release.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
      - name: Prepare Dawn headers
        run: node packages/webgpu/scripts/prepare-dawn-headers.mjs
      - name: Check Apple sources against every SDK
        run: packages/webgpu/scripts/check-apple-sdks.sh
