name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    # Green runs take 8 to 11 minutes; a hung xcodebuild used to hold this
    # runner for as long as nobody noticed.
    timeout-minutes: 30
    env:
      # Three repositories share this self-hosted machine. Each job runs on its
      # own Metro port, test server port and simulator so they can run
      # concurrently:
      #   Metro  test server  simulator
      #   8081   4242         (React Native defaults, used by redraw)
      #   8082   4243         skia-ci     (react-native-skia)
      #   8083   4244         webgpu-ci   (this job)
      # RCT_METRO_PORT is compiled into the app by xcodebuild; E2E_PORT is
      # inlined into the JS bundle (useClient) and read by the jest
      # globalSetup, so the app and the test server agree on the port.
      METRO_PORT: 8083
      E2E_PORT: 4244
      IOS_SIMULATOR: webgpu-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # `git clean` (checkout clean: true) wipes node_modules/Pods/build so the
      # native side rebuilds fresh, but Metro's Haste/transform cache lives
      # outside the repo (in $TMPDIR) and survives between runs. After a
      # reanimated/worklets bump that stale cache serves JS built by the old
      # Babel transform, which shows up as "mismatch between native worklet
      # version and JS one". Clear it so the freshly-installed worklets aren't
      # shadowed by stale transforms.
      - name: Reset React Native caches
        run: |
          watchman watch-del-all 2>/dev/null || true
          TMP="$(node -e 'console.log(require("os").tmpdir())')"
          rm -rf "$TMP"/metro-* "$TMP"/haste-map-* 2>/dev/null || true
          rm -rf /tmp/metro-* /tmp/haste-map-* 2>/dev/null || true

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn tsc

      - name: Build packages
        run: yarn turbo run build --filter='./packages/*'

      - name: Build Expo WebGPU template for web
        run: yarn workspace expo-webgpu-template build:web

      - name: Test Expo config plugin
        working-directory: packages/webgpu
        run: yarn test:plugin

      # Validate the semantic-release config without publishing, so a broken
      # .releaserc or publish script is caught on PRs rather than at release time.
      - name: Release dry run
        working-directory: packages/webgpu
        run: yarn semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ''
          NPM_TOKEN: ''

      # Build the docs site the same way the Pages deploy does (GITHUB_PAGES set,
      # so the project base path is applied) to catch broken links / build
      # regressions before they reach main.
      - name: Build docs
        env:
          GITHUB_PAGES: "true"
        run: yarn build:docs

      - name: Install CocoaPods
        working-directory: apps/example/ios
        run: pod install

      # Clear anything a previous or cancelled run left on this job's ports.
      - name: Ensure Metro and test server ports are free
        run: |
          lsof -ti :$METRO_PORT | xargs -r kill -9 || true
          lsof -ti :$E2E_PORT | xargs -r kill -9 || true

      - name: Start Package Manager
        working-directory: apps/example
        # --reset-cache: force Metro to re-transform from the freshly-installed
        # node_modules instead of reusing the cache that survives `git clean`.
        # This is the key guard against the native/JS worklet version mismatch,
        # and it also guarantees the bundle carries this job's E2E_PORT rather
        # than one inlined by a previous run.
        run: CI=true yarn start --port $METRO_PORT --reset-cache &

      # RCT_METRO_PORT feeds React-Core's GCC_PREPROCESSOR_DEFINITIONS, which
      # is where RCTBundleURLProvider takes its default packager port from.
      - name: Build example for iOS
        working-directory: apps/example/ios
        run: |
          set -o pipefail && xcodebuild \
            -workspace example.xcworkspace \
            -scheme Example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING=YES \
            RCT_METRO_PORT=$METRO_PORT \
            -disableAutomaticPackageResolution \
            build | xcpretty

      # A dedicated simulator, created once on the newest iOS runtime, so this
      # job never shares a device with the other repositories on the machine:
      # `booted` is ambiguous as soon as another job has its own simulator up.
      - name: Prepare iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r --arg name "$IOS_SIMULATOR" '
            .devices[] | .[] | select(.name == $name) | .udid' | head -n 1)
          if [ -z "$UDID" ]; then
            # Sorted numerically: the version is a string and simctl lists
            # device types newest first, so a plain `last` is not the newest.
            RUNTIME=$(xcrun simctl list runtimes available --json | jq -r '
              .runtimes | map(select(.platform == "iOS"))
              | sort_by(.version | split(".") | map(tonumber)) | last | .identifier')
            DEVICE_TYPE=$(xcrun simctl list devicetypes --json | jq -r '
              .devicetypes | map(select(.name | test("^iPhone [0-9]+ Pro$")))
              | sort_by(.name | capture("^iPhone (?<n>[0-9]+) Pro$").n | tonumber) | last | .identifier')
            echo "Creating $IOS_SIMULATOR ($DEVICE_TYPE, $RUNTIME)"
            UDID=$(xcrun simctl create "$IOS_SIMULATOR" "$DEVICE_TYPE" "$RUNTIME")
          fi
          echo "Using simulator $IOS_SIMULATOR ($UDID)"
          echo "IOS_SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          # Never test against a binary left over from a previous run.
          xcrun simctl uninstall "$UDID" com.microsoft.ReactTestApp || true

      - name: Install and launch app on Simulator
        run: |
          xcrun simctl install "$IOS_SIMULATOR_UDID" apps/example/ios/build/Build/Products/Debug-iphonesimulator/ReactTestApp.app
          xcrun simctl launch "$IOS_SIMULATOR_UDID" com.microsoft.ReactTestApp

      - name: Run e2e tests
        working-directory: packages/webgpu
        run: yarn test

      # Upload the snapshot folder so reference images generated on this run
      # (checkImage writes missing snapshots) and the *.test.png /
      # *-diff-test.png images from failed comparisons can be inspected.
      # `always()` so the artifact is available precisely when tests fail.
      - name: Upload test snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-test-snapshots
          path: packages/webgpu/src/__tests__/snapshots/

      # Housekeeping for the self-hosted runner: the start-of-run kill already
      # guarantees a clean slate for the next build, so this is not needed for
      # correctness. It just shrinks the window during which an idle Metro and
      # the simulator sit holding this job's ports, file watchers, and memory
      # while the machine runs the other repositories' jobs. `always()` so it
      # runs even when an earlier step fails.
      - name: Clean up
        if: always()
        run: |
          lsof -ti :$METRO_PORT | xargs -r kill -9 || true
          lsof -ti :$E2E_PORT | xargs -r kill -9 || true
          if [ -n "$IOS_SIMULATOR_UDID" ]; then
            xcrun simctl shutdown "$IOS_SIMULATOR_UDID" || true
          fi

  # The SwiftPM example gets its own job on a GitHub-hosted Mac. It needs no
  # Metro, simulator or CocoaPods, so nothing ties it to the self-hosted
  # machine, and a fresh runner is the strictest check that the WebGPUDawn
  # binaryTarget resolves from the release zip + checksum with nothing cached.
  # It used to be a step of `build`: a hung xcodebuild there blocked the iOS
  # e2e result and held the self-hosted runner, which has no slack for that.
  build-spm-ios:
    runs-on: macos-latest
    # Cold run: yarn install, Dawn download, RN artifacts, then one xcodebuild.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: yarn turbo run build --filter='./packages/*'

      # xcpretty is a gem, not part of the macOS runner image.
      - name: Install xcpretty
        run: command -v xcpretty >/dev/null || sudo gem install xcpretty --no-document

      # spm-example sits outside the yarn workspace so its React Native can
      # differ from the one apps/example pins: SwiftPM autolinking needs
      # React Native 0.87+. It ships no lockfile; react and react-native are
      # pinned exactly in its package.json.
      - name: Install spm-example dependencies
        working-directory: spm-example
        run: npm install

      # The .xcodeproj is committed already injected, so this refreshes the
      # injection, runs codegen and downloads the React Native artifacts. It
      # exits 2 if a linked library ships no Package.swift.
      - name: Set up Swift Package Manager (spm-example)
        working-directory: spm-example/ios
        run: npx react-native spm update

      # No CocoaPods and no -disableAutomaticPackageResolution here (unlike
      # the example app build above): react-native-webgpu is linked through
      # its own Package.swift, and its WebGPUDawn binaryTarget resolves to a
      # remote release zip + checksum with nothing cached ahead of time: this
      # build's whole point is exercising that download-and-verify step.
      - name: Build spm-example for iOS
        working-directory: spm-example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SpmExample.xcodeproj \
            -scheme SpmExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath spm-build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DISABLE_MANUAL_TARGET_ORDER_BUILD_WARNING=YES \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log | xcpretty || {
              echo "::group::xcodebuild errors"
              grep -E "error:|fatal error" xcodebuild.log | sort -u | head -50
              echo "::endgroup::"
              exit 1
            }

  # Android e2e on a GitHub-hosted emulator. The runner has no GPU, so the guest
  # sees a SwiftShader (software) Vulkan 1.3 device through gfxstream, which Dawn
  # exposes as a fallback adapter. Specs that need hardware-only paths (hardware
  # buffer import, video decoding, view snapshots) gate on device features and
  # skip themselves where the emulator lacks them.
  #
  # The guest image has to be API 34 or newer. On the API 30 image the guest
  # Vulkan driver fails to mmap its host-visible memory block
  # (goldfish-address-space errno 1, with every emulator binary tried) and the
  # app SIGSEGVs on the first mappedAtCreation buffer; API 35 runs the whole
  # suite in two minutes. See #505 for the experiment.
  build-test-android:
    runs-on: ubuntu-latest
    # Gradle build ~15 min, setup ~7, emulator boot ~1, suite ~2.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node_modules, the Gradle caches, the NDK and the emulator image add up to
      # more than the runner's free disk, so drop the toolchains this job never
      # uses. The swap file stays: Gradle, Metro and the emulator share 16 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Set ANDROID_NDK
        run: echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Finalize Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > apps/example/android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/example/android/gradle/wrapper/gradle-wrapper.properties', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        working-directory: apps/example/android
        env:
          # Only the emulator ABI runs below, so skip the other three.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
        run: ./gradlew assembleDebug --warning-mode all --stacktrace

      # Hardware acceleration for the emulator.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # CI=true is inlined into the bundle and opens the app on the Tests screen.
      # The background bundle request warms Metro's transform cache while the
      # emulator boots, so the app's own first request is served in seconds
      # instead of minutes.
      - name: Start Package Manager
        working-directory: apps/example
        run: |
          CI=true yarn start &
          (sleep 10 && curl -sf --retry 12 --retry-connrefused --retry-delay 5 -o /dev/null "http://localhost:8081/index.bundle?platform=android&dev=true&minify=false") &

      # The action runs each script line in its own shell, hence the detached
      # logcat capture instead of a trap. Metro is reached through adb reverse
      # as well as the emulator's 10.0.2.2 default; the test server on 4242 is
      # reversed by the jest globalSetup itself.
      - name: Run e2e tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 5X
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swangle_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb reverse tcp:8081 tcp:8081
            nohup adb logcat > logcat.txt 2>&1 &
            adb install -r apps/example/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.microsoft.reacttestapp 1
            cd packages/webgpu && yarn test

      # Same purpose as the iOS upload above: missing snapshots written on this
      # run and the *.test.png images from failed comparisons.
      - name: Upload test snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-test-snapshots-android
          path: packages/webgpu/src/__tests__/snapshots/

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logcat
          path: logcat.txt
          if-no-files-found: ignore
