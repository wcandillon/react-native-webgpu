import java.nio.file.Paths

buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

static def findNodeModules(baseDir) {
  // Check if we are building the example app:
  // Check if ../FabricExample/node_modules exists
  def exampleAppPath = Paths.get(baseDir.toString(), "..", "FabricExample")
  def exampleNodeModulesPath = Paths.get(exampleAppPath.toString(), "node_modules")
  if (exampleNodeModulesPath.toFile().exists()) {
    return exampleNodeModulesPath.toAbsolutePath()
  }

  def basePath = baseDir.toPath().normalize()
  // Node's module resolution algorithm searches up to the root directory,
  // after which the base path will be null
  while (basePath) {
    def nodeModulesPath = Paths.get(basePath.toString(), "node_modules")
    def reactNativePath = Paths.get(nodeModulesPath.toString(), "react-native")
    if (nodeModulesPath.toFile().exists() && reactNativePath.toFile().exists()) {
      return nodeModulesPath.toString()
    }
    basePath = basePath.getParent()
  }

  throw new GradleException("react-native-webgpu: Failed to find node_modules/ path!")
}

def nodeModules = findNodeModules(projectDir)

// Dawn, the WebGPU implementation, is an asset of the GitHub release
// binaries-<version> of react-native-skia: one archive per ABI holding
// <abi>/libwebgpu_dawn.so, and one holding the headers under include/.
// binaries.json pins that version and the sha256 of every asset. Gradle
// downloads the archives of the ABIs being built as dependencies (see the
// repository and prepareDawnBinaries below), so they sit in the Gradle user
// home cache like any other dependency, and prepareDawnBinaries extracts them
// into build/binaries. react-native-skia's Graphite backend links the Dawn of
// the same release, so an app installing both contains exactly one Dawn.
def binaries = new groovy.json.JsonSlurper().parse(file("${projectDir}/../binaries.json"))
def dawnDir = file("${buildDir}/binaries")
logger.warn("react-native-webgpu: Dawn ${binaries.version} in ${dawnDir}")

// Where the releases are downloaded from: <url>/binaries-<version>/<asset>.
// A mirror, or a directory (file:///...) for builds without network access,
// is set with the reactNativeSkiaBinariesUrl Gradle property or the
// REACT_NATIVE_SKIA_BINARIES_URL environment variable, the ones
// react-native-skia reads too.
def binariesUrl = (project.findProperty('reactNativeSkiaBinariesUrl')
  ?: System.getenv('REACT_NATIVE_SKIA_BINARIES_URL')
  ?: 'https://github.com/wcandillon/react-native-skia/releases/download').toString()

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["Wgpu_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["Wgpu_" + name]).toInteger()
}

// androidMinSdkVersion in package.json is the lowest API level the native code
// builds for: it calls the AHardwareBuffer API, from Android 8 (API 26). An
// app's lower minSdkVersion does not lower it, so such an app gets the
// manifest merger's error, with its suggested fix, instead of the compiler's.
def resolveMinSdkVersion() {
  def floor = new groovy.json.JsonSlurper().parse(file("../package.json")).androidMinSdkVersion as Integer
  def app = rootProject.ext.has("minSdkVersion") ? rootProject.ext.get("minSdkVersion").toString().toInteger() : floor
  return Math.max(app, floor)
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  if (rootProject.hasProperty("ndkPath")) {
    ndkPath = rootProject.ext.ndkPath
  }
  if (rootProject.hasProperty("ndkVersion")) {
    ndkVersion = rootProject.ext.ndkVersion
  }

  defaultConfig {
    minSdkVersion resolveMinSdkVersion()
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
    externalNativeBuild {
      cmake {
        cppFlags "-fexceptions", "-frtti", "-DONANDROID"
        abiFilters (*reactNativeArchitectures())
        arguments '-DANDROID_STL=c++_shared',
          "-DNODE_MODULES_DIR=${nodeModules}",
          "-DDAWN_DIR=${dawnDir}",
          "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
      }
    }
  }

  packagingOptions {
    excludes = [
      "**/libjsi.so",
      "**/libreactnativejni.so",
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "src/newarch",
        // This is needed to build Kotlin project with NewArch enabled
        "${project.buildDir}/generated/source/codegen/java"
      ]
    }
  }

  externalNativeBuild {
    cmake {
      path file('CMakeLists.txt')
    }
  }
}

repositories {
  mavenCentral()
  google()
  // The assets of the binaries-<version> releases, as a repository: Gradle
  // then caches them in its user home and resolves them offline. Only this
  // group is looked up here, and it is looked up nowhere else.
  exclusiveContent {
    forRepository {
      ivy {
        name = "ReactNativeSkiaBinaries"
        url = uri(binariesUrl)
        patternLayout {
          artifact "binaries-[revision]/[module](-[classifier]).[ext]"
        }
        metadataSources { artifact() }
      }
    }
    filter { includeGroup "react-native-skia-binaries" }
  }
}

configurations {
  dawnBinaries {
    canBeConsumed = false
    transitive = false
  }
}

// sha256 → asset, for the archives this build downloads.
def binaryChecksums = [:]
def dawnBinary = { String module, String abi ->
  def name = abi == null ? "${module}.zip".toString() : "${module}-${abi}.zip".toString()
  def asset = binaries.assets[name]
  if (asset == null) {
    throw new GradleException("react-native-webgpu: binaries ${binaries.version} have no ${name}.")
  }
  binaryChecksums[asset.sha256.toString()] = name
  return "react-native-skia-binaries:${module}:${binaries.version}" + (abi == null ? "" : ":${abi}") + "@zip"
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  dawnBinaries dawnBinary('dawn-headers', null)
  reactNativeArchitectures().each { abi ->
    dawnBinaries dawnBinary('dawn-android', abi)
  }
}

// Extracts the downloaded archives into build/binaries (<abi>/ and include/),
// where CMake reads them from, once each matches the sha256 binaries.json pins
// for it.
def prepareDawnBinaries = tasks.register('prepareDawnBinaries') {
  def archives = configurations.dawnBinaries
  def checksums = binaryChecksums
  def destination = dawnDir
  def version = binaries.version
  inputs.files(archives)
  inputs.property('checksums', checksums)
  outputs.dir(destination)
  doLast {
    destination.deleteDir()
    destination.mkdirs()
    def root = destination.canonicalPath + File.separator
    def pending = new HashMap(checksums)
    archives.files.each { File archive ->
      def digest = java.security.MessageDigest.getInstance('SHA-256')
      archive.eachByte(1 << 20) { buffer, read -> digest.update(buffer, 0, read) }
      def sha256 = digest.digest().encodeHex().toString()
      if (pending.remove(sha256) == null) {
        throw new GradleException(
          "react-native-webgpu: ${archive} (sha256 ${sha256}) is not one of the " +
          "archives of binaries ${version}: its checksum is not in binaries.json. " +
          "Build with --refresh-dependencies to download it again.")
      }
      new java.util.zip.ZipFile(archive).withCloseable { zip ->
        Collections.list(zip.entries()).each { entry ->
          def target = new File(destination, entry.name)
          if (!target.canonicalPath.startsWith(root)) {
            throw new GradleException(
              "react-native-webgpu: ${archive.name} has an entry outside of the archive: ${entry.name}")
          }
          if (entry.directory) {
            target.mkdirs()
          } else {
            target.parentFile.mkdirs()
            zip.getInputStream(entry).withCloseable { input ->
              target.withOutputStream { output -> output << input }
            }
          }
        }
      }
    }
    if (!pending.isEmpty()) {
      throw new GradleException(
        "react-native-webgpu: archives missing from binaries ${version}: ${pending.values().join(', ')}")
    }
  }
}
preBuild.dependsOn(prepareDawnBinaries)
